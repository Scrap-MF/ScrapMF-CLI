name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # Manual dry-run: exercises the build matrix without creating a release
  # (publish stays tag-only). Run it from the Actions tab before a release.
  workflow_dispatch:

# Consecutive pushes to the same branch supersede older runs — a full gate
# for a commit we already replaced wastes runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Prebuilt binaries — compiling just/nextest/deny from source costs
      # several minutes per run.
      - name: Install tools (just · cargo-nextest · cargo-deny)
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny

      # Cache ~/.cargo and target, invalidated by Cargo.lock/rustc changes.
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # Mirrors `just quick` — keep recipes in justfile as the single source
      - name: Quick gate (fmt + clippy + tests)
        run: just quick

      - name: Build release
        run: cargo build --release

      # Mirrors the deny part of `just validate`
      # NOTE: no --all-features flag — removed in cargo-deny 0.18+; the
      # setting lives in .cargo/deny.toml [graph] now.
      - name: Security policy (cargo-deny)
        run: cargo deny --config .cargo/deny.toml check

  # Build every target in parallel and upload archives as workflow artifacts.
  # The release itself is created by the single `publish` job below — matrix
  # jobs must never call action-gh-release concurrently: they race to create
  # the same release, losers fail on upload (seen on v1.0.0), and a published
  # release is immutable so late assets are rejected outright.
  #
  # Cross-compiling on ubuntu: Rust bundles the static musl CRT objects, so
  # the gnu cross-gcc works as the linker for musl targets too. Windows is
  # built natively with MSVC (standalone exe, no MinGW runtime surprises).
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: ci
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
          - target: powerpc64le-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchains (armv7)
        if: startsWith(matrix.target, 'armv7-')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Install cross toolchains (aarch64)
        if: startsWith(matrix.target, 'aarch64-')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install cross toolchains (riscv64 / powerpc64le)
        if: contains(matrix.target, 'riscv64') || startsWith(matrix.target, 'powerpc64le')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu gcc-powerpc64le-linux-gnu
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # rusqlite (bundled SQLite) compiles C — musl targets need a real musl
      # cross-gcc or the binary would link glibc and stop being static.
      - name: Install musl cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cd /tmp
          curl -fsSLO https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz
          echo "/tmp/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
      - name: Install musl cross toolchain (armv7)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          cd /tmp
          curl -fsSLO https://musl.cc/armv7l-linux-musleabihf-cross.tgz
          tar xzf armv7l-linux-musleabihf-cross.tgz
          echo "/tmp/armv7l-linux-musleabihf-cross/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            armv7-*)                    export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
                                        export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=arm-linux-gnueabihf-gcc ;;
            aarch64-unknown-linux-*)    export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
                                        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc ;;
            riscv64gc-*)                export CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc ;;
            powerpc64le-*)              export CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER=powerpc64le-linux-gnu-gcc ;;
          esac
          # cc crate: force musl compilers for static musl targets (SQLite C code)
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)  export CC_x86_64_unknown_linux_musl=musl-gcc
                                        export AR_x86_64_unknown_linux_musl=ar ;;
            aarch64-unknown-linux-musl) export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc
                                        export AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar
                                        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc ;;
            armv7-unknown-linux-musleabihf) export CC_armv7_unknown_linux_musleabihf=armv7l-linux-musleabihf-gcc
                                        export AR_armv7_unknown_linux_musleabihf=armv7l-linux-musleabihf-ar
                                        export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=armv7l-linux-musleabihf-gcc ;;
          esac
          cargo build --release --target ${{ matrix.target }} --locked
      - name: Create archive
        shell: bash
        run: |
          BIN=scrapmf
          case "${{ matrix.target }}" in *windows*) BIN=scrapmf.exe ;; esac
          tar czf "scrapmf-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          sha256sum "scrapmf-${{ matrix.target }}.tar.gz" > "scrapmf-${{ matrix.target }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrapmf-${{ matrix.target }}
          path: |
            scrapmf-${{ matrix.target }}.tar.gz
            scrapmf-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  # Single writer: one job gathers all archives and creates exactly one
  # release — no races, all-or-nothing visibility.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: scrapmf-*
          merge-multiple: true
          path: dist
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
